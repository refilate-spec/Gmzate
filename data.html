<!-- =====================================================
     SCROLLING CARD TEMPLATE
===================================================== -->
<div id="scrolling-data">
<template id="scrolling-card-template">

    <div
        class="app-card bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all duration-300 p-4 relative overflow-hidden flex flex-col justify-between flex-shrink-0 w-[330px] sm:w-[380px] snap-start"
        data-category="{{category}}"
        data-name="{{name}}">

        <!-- Number -->
        <div class="absolute top-0 left-0 bg-red-600 text-white font-extrabold text-xs px-3 py-1 rounded-br-xl shadow-sm z-10">
            <span class="noxi-no"></span>
        </div>

        <div class="flex items-start space-x-4 pt-2">

            <!-- Icon -->
            <div class="relative flex-shrink-0">

                <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-gradient-to-tr from-blue-500 via-indigo-600 to-purple-600 p-0.5 shadow-md">

                    <div class="w-full h-full bg-slate-900 rounded-[14px] overflow-hidden">

                        <img
                            src="{{icon}}"
                            alt="{{name}}"
                            class="w-full h-full object-cover"
                            loading="lazy">

                    </div>

                </div>

                <span class="absolute -bottom-1 -right-1 bg-emerald-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow border border-white">
                    {{rating}}★
                </span>

            </div>


            <!-- Info -->
            <div class="flex-1 min-w-0">

                <div class="flex items-center justify-between gap-2">

                    <h3 class="text-base sm:text-lg font-bold text-slate-900 truncate">
                        {{name}}
                    </h3>

                    <span class="text-[11px] font-medium text-slate-400 bg-slate-100 px-2 py-0.5 rounded whitespace-nowrap">
                        {{size}}
                    </span>

                </div>


                <p class="text-xs text-slate-500 font-medium mt-0.5">
                    Version {{version}} • Verified App
                </p>


                <div class="mt-2.5 space-y-1">

                    <div class="flex items-center text-xs font-semibold text-red-600">
                        <span class="mr-1.5">✦</span>
                        {{feature1}}
                    </div>

                    <div class="flex items-center text-xs font-medium text-slate-700">
                        <span class="mr-1.5">✓</span>
                        {{feature2}}
                    </div>

                </div>

            </div>

        </div>


        <!-- Bottom -->
        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">

            <div class="flex items-center space-x-1 text-[11px] text-emerald-600 font-semibold">

                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>

                <span>{{status}}</span>

            </div>


            <button
                type="button"
                data-download-button
                class="px-5 py-2.5 bg-gradient-to-r from-slate-900 to-slate-800 hover:from-red-600 hover:to-red-700 text-white font-semibold text-xs sm:text-sm rounded-full shadow-md shadow-slate-900/20 transition-all flex items-center space-x-2">

                <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    viewBox="0 0 24 24">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>

                </svg>

                <span>{{button}}</span>

            </button>

        </div>

    </div>

</template>
</div>
